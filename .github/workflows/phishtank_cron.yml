name: Update PhishTank Data

# Wakes up every 12 hours automatically
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

# THIS IS THE MAGIC FIX: Gives the bot permission to save the file!
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      # Updated to v4 to fix the yellow Node.js warning
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # NEW: Installs the library needed to push data to your server
      - name: Install dependencies
        run: pip install requests

      - name: Run Extraction Script
        run: python scripts/update_phishtank.py

      - name: Commit and Push to GitHub
        run: |
          git config --global user.name "PhishGuard-Bot"
          git config --global user.email "bot@phishguard.local"
          git add phishtank_domains.txt
          git commit -m "Automated PhishTank Update [skip ci]" || echo "No new domains to update today"
          git push
