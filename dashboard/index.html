<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<title>PhishGuard - Login</title>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7fe; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
    .login-box h1 { color: #1a73e8; margin-bottom: 5px; }
    .login-box p { color: #888; font-size: 14px; margin-bottom: 30px; }
    input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { background: #1557b0; }
</style>
</head>
<body>
    <div class="login-box">
        <h1>🛡️ PhishGuard</h1>
        <p>Admin Authentication System</p>
        <input type="text" placeholder="Username" value="admin">
        <input type="password" placeholder="Password" value="password">
        <button onclick="window.location.href='dashboard.html'">L O G I N</button>
    </div>
</body>
</html>
