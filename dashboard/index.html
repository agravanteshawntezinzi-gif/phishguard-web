<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhishGuard | Admin Auth</title>

<!-- Tab Icon set to Logo -->
<link rel="icon" type="image/png" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    /* Base background */
    body { 
        font-family: 'Inter', sans-serif; 
        background-color: #f4f7fe; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        margin: 0; 
        overflow: hidden;
        position: relative;
    }

    /* THE SECRET TO GLASSMORPHISM: Background Shapes to Blur! */
    .bg-shape-1 {
        position: absolute;
        width: 400px;
        height: 400px;
        background: #1a73e8; /* PhishGuard Blue */
        border-radius: 50%;
        top: -100px;
        left: -100px;
        filter: blur(80px);
        opacity: 0.3;
        z-index: 0;
    }
    .bg-shape-2 {
        position: absolute;
        width: 350px;
        height: 350px;
        background: #1e8e3e; /* PhishGuard Green */
        border-radius: 50%;
        bottom: -50px;
        right: -50px;
        filter: blur(90px);
        opacity: 0.25;
        z-index: 0;
    }
    
    /* Transparent / Glassmorphism Container */
    .login-box { 
        position: relative;
        z-index: 10; /* Keeps it above the glowing orbs */
        /* Frosted Glass Effect */
        background: rgba(255, 255, 255, 0.4); 
        backdrop-filter: blur(16px); 
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.6); 
        
        padding: 40px; 
        border-radius: 20px; 
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1); 
        width: 100%; 
        max-width: 380px; 
        text-align: center; 
    }

    .login-logo { 
        width: 70px; 
        height: auto; 
        margin-bottom: 15px; 
        filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1));
    }
    
    .login-box h1 { 
        color: #1a73e8; 
        margin: 0 0 5px 0; 
        font-size: 26px; 
        font-weight: 700; 
    }
    .login-box p { 
        color: #555; 
        font-size: 14px; 
        margin-bottom: 30px; 
        font-weight: 600;
    }
    
    .input-group {
        position: relative;
        margin-bottom: 15px;
    }
    
    /* Glass Inputs */
    input { 
        width: 100%; 
        padding: 15px; 
        background: rgba(255, 255, 255, 0.6); 
        color: #333; 
        border: 1px solid rgba(255, 255, 255, 0.8); 
        border-radius: 8px; 
        box-sizing: border-box; 
        font-size: 14px; 
        font-family: 'Inter', sans-serif; 
        outline: none; 
        transition: 0.3s; 
    }
    input::placeholder {
        color: #888;
    }
    input[type="password"], input.password-text-mode {
        padding-right: 45px; 
    }
    input:focus { 
        border-color: #1a73e8; 
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15); 
    }
    
    /* SVG Toggle Button Styling */
    .toggle-pass {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #888;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        padding: 0;
        outline: none;
        transition: color 0.2s;
    }
    .toggle-pass:hover {
        color: #1a73e8;
    }

    /* Standard PhishGuard Blue Button */
    button.submit-btn { 
        width: 100%; 
        padding: 15px; 
        background: #1a73e8; 
        color: white; 
        border: none; 
        border-radius: 8px; 
        font-size: 16px; 
        font-weight: bold; 
        cursor: pointer; 
        transition: 0.3s; 
        box-shadow: 0 4px 15px rgba(26, 115, 232, 0.3); 
        margin-top: 10px;
    }
    button.submit-btn:hover { 
        background: #1557b0; 
        transform: translateY(-2px); 
    }
    
    .error-msg {
        color: #d93025; 
        font-size: 13px; 
        margin-top: 15px; 
        display: none;
        font-weight: 600;
    }
    
    /* SVG Icon Toggle Classes */
    .svg-eye-open { display: block; }
    .svg-eye-closed { display: none; }
    
    /* When active (password visible) */
    .show-password .svg-eye-open { display: none; }
    .show-password .svg-eye-closed { display: block; }
    
</style>
</head>
<body>

    <!-- The glowing shapes in the background -->
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>

    <div class="login-box">
        <img src="img/logo.png" alt="PhishGuard Logo" class="login-logo">
        <h1>PhishGuard</h1>
        <p>Admin System Authentication</p>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="Username" autocomplete="off">
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
            
            <!-- SVG Eye Icon -->
            <button type="button" class="toggle-pass" onclick="togglePassword()" id="toggleBtn">
              <svg class="shrink-0 size-3.5" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Eye Open Paths -->
                <path class="svg-eye-open" d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path class="svg-eye-open" d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path class="svg-eye-open" d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line class="svg-eye-open" x1="2" x2="22" y1="2" y2="22"/>
                
                <!-- Eye Closed Paths -->
                <path class="svg-eye-closed" d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle class="svg-eye-closed" cx="12" cy="12" r="3"/>
              </svg>
            </button>
        </div>
        
        <button class="submit-btn" onclick="handleLogin()">Secure Login</button>
        <p id="errorMsg" class="error-msg">❌ Invalid username or password.</p>
    </div>

    <script>
        // 1. AUTO-LOGIN CHECK
        window.onload = function() {
            const authStatus = localStorage.getItem('pg_admin_auth');
            const authExpiry = localStorage.getItem('pg_admin_expiry');
            
            if (authStatus === 'true' && authExpiry && Date.now() < parseInt(authExpiry)) {
                window.location.replace('dashboard.html');
            }
        };

        // 2. TOGGLE PASSWORD VISIBILITY 
        function togglePassword() {
            const passInput = document.getElementById('password');
            const toggleBtn = document.getElementById('toggleBtn');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passInput.classList.add('password-text-mode');
                toggleBtn.classList.add('show-password');
            } else {
                passInput.type = 'password';
                passInput.classList.remove('password-text-mode');
                toggleBtn.classList.remove('show-password');
            }
        }

        // 3. LOGIN LOGIC
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            if(user === 'phishguardadmin' && pass === 'phishguard12345') {
                localStorage.setItem('pg_admin_auth', 'true');
                localStorage.setItem('pg_admin_expiry', Date.now() + 3600000);
                window.location.replace('dashboard.html');
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
        
        // Allow pressing Enter to login
        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
